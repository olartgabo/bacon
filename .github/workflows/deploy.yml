name: Deploy

# The box (olympus-dashboard-host) has 416Mi RAM and can't reliably run
# npm ci / next build itself — verified 2026-08-24: it throttles hard on
# disk I/O within minutes under that load. So the build happens here, on
# the runner, and only the compiled output ships to the box.
#
# Runner is pinned to ubuntu-22.04 (not ubuntu-latest) to match the box's
# glibc (2.35) — better-sqlite3's native binding is glibc-version-sensitive,
# and a binary built on a newer glibc (e.g. ubuntu-latest's 24.04) will fail
# to load on the box's older one.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npm run build

      - name: Package build artifact
        run: tar -czf build-artifact.tar.gz node_modules .next package.json package-lock.json

      - name: Upload build artifact
        env:
          DEPLOY_UPLOAD_SSH_KEY: ${{ secrets.DEPLOY_UPLOAD_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_UPLOAD_SSH_KEY" > /tmp/upload_key
          chmod 600 /tmp/upload_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          # -O forces the legacy SCP protocol so the remote forced command
          # (restrict,command="internal-sftp") receives a predictable
          # exec — modern OpenSSH defaults `scp` to the SFTP protocol,
          # which doesn't go through the same forced-command path.
          scp -O -i /tmp/upload_key build-artifact.tar.gz \
            ubuntu@"$DEPLOY_HOST":/home/ubuntu/incoming/build-artifact.tar.gz
          rm -f /tmp/upload_key

      - name: Trigger deploy on the box
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The key is restricted server-side to a single forced command
          # (see ~ubuntu/.ssh/authorized_keys on olympus-dashboard-host) —
          # whatever is sent here is ignored in favor of that command. It
          # just extracts the artifact uploaded above and restarts the
          # service, so this step is fast now (no build on the box).
          command_timeout: 3m
          script: "true"
