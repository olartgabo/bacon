name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The key is restricted server-side to a single forced command
          # (see ~ubuntu/.ssh/authorized_keys on olympus-dashboard-host) —
          # whatever is sent here is ignored in favor of that command.
          script: "true"
